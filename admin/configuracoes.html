    </nav><button type="button" id="botao-sair" class="sair-menu">🚪 Sair</button></aside><div class="conteudo-admin"><header class="topo-pedidos"><div><h1>Configurações</h1><p>Dados gerais e operação da loja</p></div><a href="../cardapio.html" class="botao-voltar">Abrir cardápio</a></header><main class="modulo-admin"><div id="mensagem-config" class="aviso">Carregando configurações...</div><section class="painel-card"><form id="form-configuracoes" class="form-config"><label>Nome da loja<input id="config-nome" required value="Igor Lanches"></label><label>WhatsApp<input id="config-whatsapp" placeholder="(35) 99999-9999"></label><label>Taxa de entrega (R$)<input id="config-taxa" type="number" min="0" step="0.01" value="7"></label><label>Tempo padrão de preparo (minutos)<input id="config-tempo" type="number" min="1" step="1" value="20"></label><label>Horário de abertura<input id="config-abertura" type="time" value="18:00"></label><label>Horário de fechamento<input id="config-fechamento" type="time" value="23:59"></label><label>Impressão automática<select id="config-auto-impressao"><option value="false">Desativada</option><option value="true">Ativada</option></select></label><label>Largura da comanda<select id="config-largura"><option value="80">80 mm</option><option value="58">58 mm</option></select></label><label class="campo-largo status-loja"><input id="config-aberta" type="checkbox" checked> Loja aberta para receber pedidos</label><label class="campo-largo">Mensagem da loja<textarea id="config-mensagem" rows="3" placeholder="Ex.: Entregas em até 45 minutos."></textarea></label><div class="campo-largo"><button class="botao-salvar" type="submit">Salvar configurações</button></div></form></section></main></div></div><script type="module" src="./auth-guard.js"></script><script type="module" src="../js/configuracoes-admin.js"></script></body></html>
