<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login administrativo | Igor Lanches</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        .login-wrap {
            width: 100%;
            max-width: 520px;
        }

        .login-card {
            width: 100%;
            padding: 36px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .login-card h1 {
            margin-bottom: 8px;
            font-size: 38px;
            line-height: 1.15;
        }

        .login-card > p {
            margin-bottom: 26px;
            font-size: 18px;
            color: #444;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .campo label {
            font-size: 17px;
            font-weight: 700;
        }

        .campo input {
            width: 100%;
            padding: 16px;
            border: 1px solid #c8c8c8;
            border-radius: 14px;
            font-size: 17px;
            outline: none;
        }

        .campo input:focus {
            border-color: #ffb000;
            box-shadow: 0 0 0 3px rgba(255, 176, 0, 0.18);
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #111111;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #ffb000;
            color: #111111;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        #login-erro {
            min-height: 22px;
            margin-top: 14px;
            color: #c62828;
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 26px 20px;
            }

            .login-card h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="login-wrap">
        <form id="login-form" class="login-card">
            <h1>🍔 Área da lanchonete</h1>

            <p>Entre para receber e controlar os pedidos.</p>

            <div class="campo">
                <label for="login-email">E-mail</label>

                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="login-senha">Senha</label>

                <input
                    type="password"
                    id="login-senha"
                    name="senha"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >
            </div>

            <button type="button" id="login-botao">Entrar</button>

            <p id="login-erro" aria-live="polite"></p>
        </form>
    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
